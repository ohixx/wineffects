    <animate attributeName="y" values="60;35;60" dur="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
  </rect>
  <rect x="144" y="80" width="16" height="60" rx="8" fill="url(#g)">
