    <animate attributeName="y" values="75;45;75" dur="1.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
  </rect>
  <rect x="116" y="60" width="16" height="100" rx="8" fill="url(#g)">
