    <animate attributeName="y" values="80;50;80" dur="1.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
  </rect>
  <rect x="172" y="95" width="16" height="30" rx="8" fill="url(#g)">
    <animate attributeName="height" values="30;80;30" dur="1.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
